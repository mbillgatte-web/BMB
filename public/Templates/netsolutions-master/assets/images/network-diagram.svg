<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460" role="img" aria-labelledby="ns-diag-title">
  <title id="ns-diag-title">Schéma d'un réseau d'entreprise</title>
  <style>
    .link { fill: none; stroke: #2a3648; stroke-width: 1.5; }
    .flow { fill: none; stroke: #1fb59b; stroke-width: 1.5; stroke-dasharray: 6 14; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    .box { fill: #111926; stroke: #33415a; stroke-width: 1.5; }
    .lbl { fill: #97a3b6; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10px; letter-spacing: .06em; }
    .dot { fill: #1fb59b; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>

  <!-- grille -->
  <g stroke="#182130" stroke-width="1">
    <path d="M0 60h600M0 120h600M0 180h600M0 240h600M0 300h600M0 360h600M0 420h600"/>
    <path d="M60 0v460M120 0v460M180 0v460M240 0v460M300 0v460M360 0v460M420 0v460M480 0v460M540 0v460"/>
  </g>

  <!-- liaisons -->
  <path class="link" d="M300 92v56"/>
  <path class="flow" d="M300 92v56"/>
  <path class="link" d="M300 208v40H120v36M300 208v40h180v36M300 208v76"/>
  <path class="flow" d="M300 208v40H120v36"/>
  <path class="flow" d="M300 208v40h180v36"/>
  <path class="flow" d="M300 208v76"/>
  <path class="link" d="M120 340v30M480 340v30M300 340v30"/>

  <!-- Internet -->
  <g>
    <circle cx="300" cy="62" r="30" class="box"/>
    <path d="M300 40a22 22 0 0 1 0 44M300 40a22 22 0 0 0 0 44M278 62h44M290 44c-6 10-6 26 0 36M310 44c6 10 6 26 0 36" fill="none" stroke="#97a3b6" stroke-width="1.5"/>
    <text x="300" y="112" text-anchor="middle" class="lbl">INTERNET</text>
  </g>

  <!-- routeur / pare-feu -->
  <g>
    <rect x="236" y="150" width="128" height="58" rx="4" class="box"/>
    <text x="300" y="173" text-anchor="middle" class="lbl">ROUTEUR</text>
    <text x="300" y="189" text-anchor="middle" class="lbl">PARE-FEU</text>
    <circle cx="248" cy="162" r="3" class="dot pulse"/>
    <circle cx="352" cy="162" r="3" fill="#33415a"/>
  </g>

  <!-- switch -->
  <g>
    <rect x="236" y="284" width="128" height="56" rx="4" class="box"/>
    <text x="300" y="306" text-anchor="middle" class="lbl">COMMUTATEUR</text>
    <g fill="#33415a">
      <rect x="250" y="316" width="10" height="8"/><rect x="264" y="316" width="10" height="8"/><rect x="278" y="316" width="10" height="8"/><rect x="292" y="316" width="10" height="8"/><rect x="306" y="316" width="10" height="8"/><rect x="320" y="316" width="10" height="8"/><rect x="334" y="316" width="10" height="8"/>
    </g>
    <rect x="250" y="316" width="10" height="8" class="dot pulse"/>
    <rect x="278" y="316" width="10" height="8" class="dot"/>
    <rect x="320" y="316" width="10" height="8" class="dot"/>
  </g>

  <!-- serveur -->
  <g>
    <rect x="76" y="284" width="88" height="56" rx="4" class="box"/>
    <g fill="none" stroke="#97a3b6" stroke-width="1.5">
      <rect x="104" y="294" width="32" height="10" rx="2"/><rect x="104" y="308" width="32" height="10" rx="2"/><rect x="104" y="322" width="32" height="10" rx="2"/>
    </g>
    <circle cx="131" cy="299" r="1.5" class="dot"/><circle cx="131" cy="313" r="1.5" class="dot"/><circle cx="131" cy="327" r="1.5" class="dot"/>
    <text x="120" y="360" text-anchor="middle" class="lbl">SERVEUR</text>
  </g>

  <!-- caméras -->
  <g>
    <rect x="436" y="284" width="88" height="56" rx="4" class="box"/>
    <path d="M458 304h26l12-6v22l-12-6h-26z" fill="none" stroke="#97a3b6" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="470" cy="312" r="3" fill="none" stroke="#97a3b6" stroke-width="1.5"/>
    <text x="480" y="360" text-anchor="middle" class="lbl">CAMÉRAS</text>
  </g>

  <!-- postes de travail -->
  <g>
    <path class="link" d="M300 370v10M120 370v10M480 370v10"/>
    <g>
      <rect x="86" y="380" width="68" height="44" rx="3" class="box"/>
      <rect x="96" y="388" width="48" height="24" rx="1" fill="#182130"/>
      <rect x="108" y="424" width="24" height="4" fill="#33415a"/>
    </g>
    <g>
      <rect x="266" y="380" width="68" height="44" rx="3" class="box"/>
      <rect x="276" y="388" width="48" height="24" rx="1" fill="#182130"/>
      <rect x="288" y="424" width="24" height="4" fill="#33415a"/>
    </g>
    <g>
      <rect x="446" y="380" width="68" height="44" rx="3" class="box"/>
      <rect x="456" y="388" width="48" height="24" rx="1" fill="#182130"/>
      <rect x="468" y="424" width="24" height="4" fill="#33415a"/>
    </g>
    <text x="300" y="448" text-anchor="middle" class="lbl">POSTES DE TRAVAIL</text>
  </g>

  <!-- Wi-Fi -->
  <g>
    <path class="link" d="M364 312h60"/>
    <path class="flow" d="M364 312h60"/>
    <circle cx="560" cy="200" r="0" fill="none"/>
    <g transform="translate(546 150)">
      <circle cx="0" cy="0" r="26" class="box"/>
      <path d="M-12 -2a17 17 0 0 1 24 0M-6 4a9 9 0 0 1 12 0" fill="none" stroke="#97a3b6" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="10" r="2" class="dot pulse"/>
    </g>
    <path class="link" d="M364 179h156"/>
    <path class="flow" d="M364 179h156"/>
    <text x="546" y="196" text-anchor="middle" class="lbl">WI-FI</text>
  </g>

  <!-- onduleur -->
  <g transform="translate(54 150)">
    <rect x="0" y="0" width="52" height="58" rx="4" class="box"/>
    <path d="M26 12l-8 18h10l-6 16 16-22h-10l6-12z" fill="none" stroke="#97a3b6" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="26" y="76" text-anchor="middle" class="lbl">ONDULEUR</text>
  </g>
  <path class="link" d="M106 179h130"/>
</svg>
