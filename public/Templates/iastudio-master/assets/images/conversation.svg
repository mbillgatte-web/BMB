<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="ia-conv-title">
  <title id="ia-conv-title">Conversation WhatsApp prise en charge par un assistant, reliée à un tableau de suivi</title>
  <style>
    .bubble { animation: pop .5s cubic-bezier(.2,.7,.2,1) both; transform-origin: left bottom; transform-box: fill-box; }
    .b1 { animation-delay: .2s; } .b2 { animation-delay: .9s; } .b3 { animation-delay: 1.6s; } .b4 { animation-delay: 2.3s; }
    .row { animation: fade .6s ease-out both; }
    .r1 { animation-delay: 1.2s; } .r2 { animation-delay: 1.9s; } .r3 { animation-delay: 2.6s; }
    .wire { stroke-dasharray: 500; stroke-dashoffset: 500; animation: draw 1.6s ease-out 1s forwards; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .bubble, .row, .wire { animation: none; stroke-dashoffset: 0; opacity: 1; } }
    .t { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #111; }
    .ts { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #6b7570; }
    .th { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #6b7570; letter-spacing: .08em; }
  </style>

  <!-- téléphone -->
  <rect x="80" y="20" width="360" height="480" rx="36" fill="#111"/>
  <rect x="92" y="32" width="336" height="456" rx="28" fill="#f4f6f4"/>
  <rect x="92" y="32" width="336" height="64" rx="28" fill="#1d4b3f"/>
  <rect x="92" y="72" width="336" height="24" fill="#1d4b3f"/>
  <circle cx="132" cy="64" r="16" fill="#ffffff" opacity=".9"/>
  <text x="160" y="60" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#fff">Assistant</text>
  <text x="160" y="78" font-family="Inter, Arial, sans-serif" font-size="12" fill="#cfe3dc">répond en quelques secondes</text>

  <g class="bubble b1">
    <rect x="112" y="116" width="220" height="58" rx="14" fill="#ffffff" stroke="#e2e7e3"/>
    <text x="126" y="140" class="t">Bonjour, vous livrez</text>
    <text x="126" y="160" class="t">à Bonabéri ?</text>
  </g>
  <g class="bubble b2">
    <rect x="176" y="188" width="232" height="78" rx="14" fill="#dcefe6"/>
    <text x="190" y="212" class="t">Oui, du lundi au samedi.</text>
    <text x="190" y="232" class="t">Livraison : 1 500 FCFA,</text>
    <text x="190" y="252" class="t">sous 24 h après commande.</text>
  </g>
  <g class="bubble b3">
    <rect x="112" y="280" width="200" height="58" rx="14" fill="#ffffff" stroke="#e2e7e3"/>
    <text x="126" y="304" class="t">Je prends 2 cartons,</text>
    <text x="126" y="324" class="t">livraison demain.</text>
  </g>
  <g class="bubble b4">
    <rect x="176" y="352" width="232" height="98" rx="14" fill="#dcefe6"/>
    <text x="190" y="376" class="t">Commande enregistrée.</text>
    <text x="190" y="396" class="t">2 cartons, livraison demain,</text>
    <text x="190" y="416" class="t">total 25 500 FCFA.</text>
    <text x="190" y="436" class="ts">Transmis à l'équipe</text>
  </g>

  <!-- liaison -->
  <path class="wire" d="M440 400c80 0 80-260 200-260h60" fill="none" stroke="#1d4b3f" stroke-width="2"/>
  <circle cx="700" cy="140" r="5" fill="#1d4b3f"/>

  <!-- tableau de suivi -->
  <rect x="700" y="60" width="440" height="330" rx="10" fill="#ffffff" stroke="#e2e7e3"/>
  <text x="724" y="96" font-family="Georgia, serif" font-size="22" fill="#111">Commandes du jour</text>
  <text x="724" y="118" class="ts">Mis à jour automatiquement</text>
  <path d="M700 136h440" stroke="#e2e7e3"/>
  <g class="th">
    <text x="724" y="160">CLIENT</text>
    <text x="900" y="160">QUANTITÉ</text>
    <text x="1020" y="160">STATUT</text>
  </g>
  <g class="row r1">
    <text x="724" y="196" class="t">Client A</text>
    <text x="900" y="196" class="t">2 cartons</text>
    <rect x="1020" y="182" width="84" height="20" rx="10" fill="#dcefe6"/>
    <text x="1032" y="196" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1d4b3f">Confirmée</text>
  </g>
  <g class="row r2">
    <text x="724" y="236" class="t">Client B</text>
    <text x="900" y="236" class="t">5 unités</text>
    <rect x="1020" y="222" width="84" height="20" rx="10" fill="#eef1ee"/>
    <text x="1032" y="236" font-family="Inter, Arial, sans-serif" font-size="12" fill="#444">En attente</text>
  </g>
  <g class="row r3">
    <text x="724" y="276" class="t">Client C</text>
    <text x="900" y="276" class="t">1 carton</text>
    <rect x="1020" y="262" width="84" height="20" rx="10" fill="#dcefe6"/>
    <text x="1032" y="276" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1d4b3f">Livrée</text>
  </g>
  <path d="M700 300h440" stroke="#e2e7e3"/>
  <!-- mini graphique -->
  <g fill="#1d4b3f">
    <rect x="724" y="350" width="14" height="24" opacity=".35"/>
    <rect x="746" y="338" width="14" height="36" opacity=".5"/>
    <rect x="768" y="344" width="14" height="30" opacity=".65"/>
    <rect x="790" y="326" width="14" height="48" opacity=".8"/>
    <rect x="812" y="318" width="14" height="56"/>
  </g>
  <text x="850" y="352" class="ts">Commandes par jour</text>
  <text x="850" y="372" class="t">Tendance de la semaine</text>

  <!-- rappel automatique -->
  <g transform="translate(700 420)">
    <rect x="0" y="0" width="300" height="60" rx="10" fill="#111"/>
    <circle cx="28" cy="30" r="8" fill="#1fb59b"/>
    <text x="48" y="26" font-family="Inter, Arial, sans-serif" font-size="13" fill="#fff">Rappel envoyé au client</text>
    <text x="48" y="44" font-family="Inter, Arial, sans-serif" font-size="12" fill="#a8b3ad">la veille de la livraison, sans intervention</text>
  </g>
</svg>
